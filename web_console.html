<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Juhuo ⚖️ 判断系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f0f23;
            color: #e0e0e0;
            min-height: 100vh;
        }
        /* ── 顶部标题栏 ── */
        .header {
            position: fixed; top: 0; left: 0; right: 0;
            height: 60px;
            background: linear-gradient(135deg, #e94560, #c73e54);
            display: flex; align-items: center;
            padding: 0 28px; z-index: 100;
            box-shadow: 0 2px 16px rgba(233,69,96,.3);
        }
        .header-title { font-size: 20px; font-weight: 700; color: #fff; }
        .header-version {
            margin-left: 12px; font-size: 12px; color: rgba(255,255,255,.6);
            background: rgba(255,255,255,.15); padding: 2px 8px; border-radius: 10px;
        }
        .main { padding-top: 60px; max-width: 860px; margin: 0 auto; padding: 60px 24px 40px; }

        /* ── 状态卡片 ── */
        .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
        .stat-card {
            background: #16213e; border-radius: 12px; padding: 16px;
            border: 1px solid rgba(233,69,96,.15); text-align: center;
        }
        .stat-num { font-size: 36px; font-weight: 700; color: #e94560; line-height: 1; }
        .stat-label { font-size: 12px; color: #666; margin-top: 4px; text-transform: uppercase; letter-spacing: 1px; }

        /* ── 判断输入区 ── */
        .judge-card {
            background: #16213e; border-radius: 16px; padding: 24px;
            border: 1px solid rgba(233,69,96,.15); margin-bottom: 24px;
        }
        .judge-card h2 { font-size: 16px; color: #fff; margin-bottom: 16px; }
        .judge-card textarea {
            width: 100%; height: 100px; background: #0f0f23; color: #fff;
            border: 1px solid rgba(255,255,255,.1); border-radius: 10px;
            padding: 14px; font-size: 15px; resize: none; font-family: inherit;
        }
        .judge-card textarea:focus { outline: none; border-color: #e94560; }
        .judge-card textarea::placeholder { color: #555; }
        .btn-row { display: flex; gap: 12px; align-items: center; margin-top: 14px; }
        .btn-primary {
            background: linear-gradient(135deg, #e94560, #c73e54);
            color: #fff; border: none; padding: 12px 32px; border-radius: 8px;
            font-size: 15px; font-weight: 600; cursor: pointer;
        }
        .btn-primary:hover { opacity: .9; transform: scale(1.01); }
        .btn-primary:disabled { opacity: .5; cursor: not-allowed; }

        /* ── 视图切换 ── */
        .view-toggle { display: flex; gap: 8px; }
        .view-btn {
            background: #0f3460; color: #888; border: none;
            padding: 8px 18px; border-radius: 8px; font-size: 13px; cursor: pointer;
        }
        .view-btn.active { background: #e94560; color: #fff; }

        /* ── 进度条区域 ── */
        .dimension-row { display: flex; align-items: center; margin: 8px 0; gap: 12px; }
        .dim-name { width: 110px; font-size: 13px; color: #aaa; text-align: right; }
        .dim-bar-wrap { flex: 1; background: #0f3460; height: 18px; border-radius: 9px; overflow: hidden; }
        .dim-bar-fill { height: 100%; border-radius: 9px; }
        .dim-score { width: 42px; font-size: 13px; color: #666; }

        /* ── 判断结果 ── */
        .result-card {
            background: #16213e; border-radius: 16px; padding: 24px;
            border: 1px solid rgba(233,69,96,.15);
            animation: fadeIn .3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; } }
        .verdict-text {
            text-align: center; font-size: 22px; font-weight: 700;
            color: #e94560; margin-bottom: 12px;
        }
        .confidence-row { text-align: center; color: #666; margin-bottom: 20px; }
        .confidence-bar-wrap { max-width: 400px; margin: 0 auto 20px; background: #0f3460; height: 8px; border-radius: 4px; overflow: hidden; }
        .confidence-bar-fill { height: 100%; background: linear-gradient(90deg,#e94560,#ff6b6b); border-radius: 4px; }
        .chain-id { font-size: 11px; color: #444; text-align: center; font-family: monospace; }

        /* ── Dashboard 视图 ── */
        .dashboard-pre {
            white-space: pre-wrap; font-family: Consolas, monospace;
            font-size: 13px; line-height: 1.6; color: #d0d0d0;
            background: #0d1b2a; padding: 18px; border-radius: 10px;
            border-left: 3px solid #e94560;
        }

        /* ── 加载状态 ── */
        .loading { text-align: center; padding: 40px; color: #666; }
        .spinner {
            width: 32px; height: 32px; border: 3px solid #16213e;
            border-top-color: #e94560; border-radius: 50%;
            animation: spin .8s linear infinite; margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── 错误 ── */
        .error { background: rgba(233,69,96,.15); border-radius: 8px; padding: 12px 16px; color: #e94560; font-size: 14px; }
    </style>
</head>
<body>

<div class="header">
    <span class="header-title">⚖️ Juhuo</span>
    <span class="header-version">判断系统</span>
</div>

<div class="main">
    <!-- 统计卡片 -->
    <div class="stats-row" id="statsRow">
        <div class="stat-card"><div class="stat-num" id="stat-total">–</div><div class="stat-label">总判断数</div></div>
        <div class="stat-card"><div class="stat-num" id="stat-correct">–</div><div class="stat-label">正确</div></div>
        <div class="stat-card"><div class="stat-num" id="stat-accuracy">–</div><div class="stat-label">准确率</div></div>
    </div>

    <!-- 判断输入 -->
    <div class="judge-card">
        <h2>📋 决策困境分析</h2>
        <textarea id="taskInput" placeholder="输入你想分析的问题，例如：要不要辞职创业？"></textarea>
        <div class="btn-row">
            <button class="btn-primary" id="judgeBtn" onclick="submitJudge()">⚖️ 判断</button>
            <div class="view-toggle">
                <button class="view-btn active" id="btn-dashboard" onclick="setView('dashboard')">仪表盘</button>
                <button class="view-btn" id="btn-bars" onclick="setView('bars')">维度条</button>
            </div>
        </div>
    </div>

    <!-- 结果 -->
    <div id="resultArea"></div>
</div>

<script>
let currentView = 'dashboard';

function setView(view) {
    currentView = view;
    document.getElementById('btn-dashboard').classList.toggle('active', view === 'dashboard');
    document.getElementById('btn-bars').classList.toggle('active', view === 'bars');
}

function renderBars(data) {
    let h = '<div class="result-card">';
    h += '<div class="verdict-text">' + esc(data.verdict || '') + '</div>';
    const conf = Math.round((data.confidence || 0) * 100);
    h += '<div class="confidence-row">置信度 ' + conf + '%</div>';
    h += '<div class="confidence-bar-wrap"><div class="confidence-bar-fill" style="width:' + conf + '%"></div></div>';
    h += '<div style="margin-top:16px">';
    const dims = data.dimensions || {};
    for (const [name, info] of Object.entries(dims)) {
        const pct = Math.round((info.score || 0) * 100);
        const hue = pct > 75 ? '#4ade80' : pct > 50 ? '#facc15' : '#e94560';
        h += '<div class="dimension-row">';
        h += '<span class="dim-name">' + esc(name) + '</span>';
        h += '<div class="dim-bar-wrap"><div class="dim-bar-fill" style="width:' + pct + '%;background:' + hue + '"></div></div>';
        h += '<span class="dim-score">' + pct + '%</span>';
        h += '</div>';
    }
    h += '</div>';
    if (data.chain_id) h += '<div class="chain-id">chain: ' + data.chain_id + '</div>';
    h += '</div>';
    return h;
}

function renderDashboard(data) {
    if (!data.dashboard) return renderBars(data);
    let h = '<div class="result-card">';
    h += '<div class="verdict-text">' + esc(data.verdict || '') + '</div>';
    h += '<pre class="dashboard-pre">' + esc(data.dashboard) + '</pre>';
    h += '</div>';
    return h;
}

function esc(s) {
    return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

function submitJudge() {
    const task = document.getElementById('taskInput').value.trim();
    if (!task) return;
    const btn = document.getElementById('judgeBtn');
    btn.disabled = true;
    document.getElementById('resultArea').innerHTML =
        '<div class="loading"><div class="spinner"></div>分析中，请稍候...</div>';
    fetch('/api/judge', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({task})
    })
    .then(r => r.json())
    .then(data => {
        btn.disabled = false;
        if (data.error) {
            document.getElementById('resultArea').innerHTML = '<div class="error">错误: ' + esc(data.error) + '</div>';
            return;
        }
        document.getElementById('resultArea').innerHTML =
            currentView === 'dashboard' ? renderDashboard(data) : renderBars(data);
    })
    .catch(e => {
        btn.disabled = false;
        document.getElementById('resultArea').innerHTML =
            '<div class="error">请求失败: ' + esc(String(e)) + '</div>';
    });
}

// 回车提交（Shift+Enter换行）
document.getElementById('taskInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        submitJudge();
    }
});

// 加载时拉取统计
fetch('/api/status').then(r => r.json()).then(data => {
    if (data.total !== undefined) {
        document.getElementById('stat-total').textContent = data.total;
        document.getElementById('stat-correct').textContent = data.correct || 0;
        document.getElementById('stat-accuracy').textContent =
            data.total > 0 ? Math.round((data.correct || 0) / data.total * 100) + '%' : '–';
    }
}).catch(() => {});
</script>
</body>
</html>
